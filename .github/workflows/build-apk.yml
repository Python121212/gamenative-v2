name: Build APK (Debug)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "legacy"
        type: choice
        options:
          - legacy
          - modern
          - legacyXr
          - modernXr
          - all

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `all` は legacy と modern を**並列**に回す（直列だと単純に倍かかる）。
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'all' && '["legacy","modern"]' || format('["{0}"]', inputs.variant)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key keeps the APK SHA-1 stable across builds,
      # which an "Android" OAuth client requires.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; falling back to the generated debug key."
            exit 0
          fi
          mkdir -p ci-signing
          echo "$KEYSTORE_BASE64" | base64 -d > ci-signing/release.jks
          echo "KEYSTORE_FILE=$PWD/ci-signing/release.jks" >> "$GITHUB_ENV"

      - name: Inject credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Never write empty values: the secrets plugin turns every entry of
          # local.properties into a BuildConfig field, and an empty one is
          # invalid Java (`= ;`).
          {
            echo "POSTHOG_API_KEY=dummy"
            echo "POSTHOG_HOST=https://us.i.posthog.com"
            if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
              echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
            fi
          } > local.properties
          sed 's/=.*/=<set>/' local.properties
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-36" "ndk;27.3.13750724"

      - name: Build debug APK
        run: |
          set -o pipefail
          case "${{ matrix.variant }}" in
            legacy) ./gradlew :app:assembleLegacyDebug ;;
            modern) ./gradlew :app:assembleModernDebug ;;
            legacyXr) ./gradlew :app:assembleLegacyXrDebug ;;
            modernXr) ./gradlew :app:assembleModernXrDebug ;;
          esac 2>&1 | tee gradle-build.log

      # The unit-test sources are not part of assembleDebug: compile them, and run the
      # translation-stack and AI-diagnosis suites so a regression in layer de-duplication
      # or in the diagnosis rules fails here (both run offline, no network).
      - name: Unit tests (translation stack + AI diagnosis)
        if: matrix.variant == 'legacy'
        run: |
          set -o pipefail
          ./gradlew :app:compileLegacyDebugUnitTestKotlin :app:testLegacyDebugUnitTest \
            --tests "app.gamenative.translation.*" --tests "app.gamenative.aidiag.*" 2>&1 | tee gradle-tests.log

      # Surface Kotlin/Gradle errors as check annotations so they can be read
      # through the API even when the raw log download is unavailable.
      # GitHub allows ~10 error annotations per step, so keep this list short and specific.
      - name: Report build errors
        if: failure()
        run: |
          emit() { printf '::error::%s\n' "$(printf '%s' "$1" | tr '%\r\n' '    ')"; }
          emit "HEAD=$(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          # Kotlin (`e: file://…`), javac, JUnit and Gradle failure lines, in that order.
          # GitHub allows ~10 annotations per step, so stop at nine.
          {
            for LOG in gradle-tests.log gradle-build.log; do
              [ -f "$LOG" ] || continue
              grep -nE '^e: |error:| FAILED|ComparisonFailure|AssertionError|expected:<|What went wrong|Execution failed for task|Caused by:' "$LOG" \
                | sed "s|^|$LOG:|" | cut -c1-350
            done
          } | head -n 9 | while IFS= read -r line; do emit "$line"; done
          for LOG in gradle-tests.log gradle-build.log; do
            [ -f "$LOG" ] && echo "$LOG: $(wc -l < "$LOG") lines"
          done

      - name: List APKs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # Drive pseudo-SSD のログインに必要な OAuth クライアントIDは APK に埋め込まれる。
      # 既定値で必ず入るはずなので、抜けたら失敗させる（設定漏れの回帰防止）。
      - name: Verify Drive OAuth client is baked in
        if: success()
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK が見つかりません"
            exit 1
          fi
          CONFIG=$(unzip -p "$APK" assets/drive_oauth.json 2>/dev/null | tr -d '\r\n')
          echo "assets/drive_oauth.json = ${CONFIG:-<missing>}"
          case "$CONFIG" in
            *".apps.googleusercontent.com"*) echo "::notice::Drive OAuth client: $CONFIG" ;;
            *)
              echo "::error::Drive の OAuth クライアントIDが APK に入っていません: ${CONFIG:-missing}"
              exit 1
              ;;
          esac
          # リダイレクト用のカスタムスキームがマニフェストに入っているかも確認する。
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            if "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml 2>/dev/null | grep -q "googleusercontent"; then
              echo "::notice::redirect scheme is declared in the manifest"
            else
              echo "::warning::マニフェストに googleusercontent スキームが見つかりません"
            fi
          fi

      # The signature must be the same for every CI build, otherwise updating an
      # installed APK fails with "app not installed" (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # It also identifies the "Android" OAuth client used by the Drive pseudo-SSD.
      - name: Verify APK signing key is stable
        if: success()
        run: |
          # 小文字・コロン無しで返るので、比較はコロンを落とした大文字で行う。
          EXPECTED=$(echo "85:D8:C9:35:B6:83:91:AF:20:9B:7D:45:98:AE:1B:AC:3E:06:90:F2" | tr -d ':')
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ] || [ -z "$APKSIGNER" ]; then
            echo "::warning::APK または apksigner が見つからないため署名を確認できません"
            exit 0
          fi
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-1 digest' | head -1 | sed 's/.*: //' | tr -d ':' | tr 'a-f' 'A-F')
          echo "APK SHA-1: $ACTUAL"
          echo "expected : $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK の署名が固定鍵と一致しません（更新インストールに失敗します）: ${ACTUAL:-unknown} != $EXPECTED"
            exit 1
          fi
          echo "::notice::APK signing SHA-1 is stable: $ACTUAL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-${{ matrix.variant }}-debug
          path: app/build/outputs/apk/**/app-*-debug.apk
          if-no-files-found: error
