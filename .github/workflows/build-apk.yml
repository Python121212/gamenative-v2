name: Build APK (Debug)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "legacy"
        type: choice
        options:
          - legacy
          - modern
          - legacyXr
          - modernXr
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID
          GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET
          EOF

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-36" "ndk;27.3.13750724"

      - name: Build debug APK
        run: |
          set -o pipefail
          case "${{ inputs.variant }}" in
            legacy) ./gradlew :app:assembleLegacyDebug ;;
            modern) ./gradlew :app:assembleModernDebug ;;
            legacyXr) ./gradlew :app:assembleLegacyXrDebug ;;
            modernXr) ./gradlew :app:assembleModernXrDebug ;;
            all) ./gradlew :app:assembleLegacyDebug :app:assembleModernDebug ;;
          esac 2>&1 | tee gradle-build.log

      # Surface Kotlin/Gradle errors as check annotations so they can be read
      # through the API even when the raw log download is unavailable.
      - name: Report build errors
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then exit 0; fi
          # Emit Kotlin/Gradle errors (with their continuation lines) as check
          # annotations so they can be read through the API.
          awk '/^e: /{n++} n>0 && n<=8 {print}' gradle-build.log | head -n 60 | \
            while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | tr '%\r\n' '    ')
              echo "::error::$escaped"
            done
          awk '/What went wrong\??:/{p=1;c=0} p&&c<25{print;c++}' gradle-build.log | \
            while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | tr '%\r\n' '    ')
              echo "::error::$escaped"
            done
          tail -n 40 gradle-build.log

      - name: List APKs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-${{ inputs.variant }}-debug
          path: app/build/outputs/apk/**/app-*-debug.apk
          if-no-files-found: error
