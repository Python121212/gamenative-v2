name: Build APK (Debug)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "legacy"
        type: choice
        options:
          - legacy
          - modern
          - legacyXr
          - modernXr
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID
          GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET
          EOF

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-36" "ndk;27.3.13750724"

      - name: Build debug APK
        run: |
          set -o pipefail
          case "${{ inputs.variant }}" in
            legacy) ./gradlew :app:assembleLegacyDebug ;;
            modern) ./gradlew :app:assembleModernDebug ;;
            legacyXr) ./gradlew :app:assembleLegacyXrDebug ;;
            modernXr) ./gradlew :app:assembleModernXrDebug ;;
            all) ./gradlew :app:assembleLegacyDebug :app:assembleModernDebug ;;
          esac 2>&1 | tee gradle-build.log

      # Surface Kotlin/Gradle errors as check annotations so they can be read
      # through the API even when the raw log download is unavailable.
      - name: Report build errors
        if: failure()
        run: |
          emit() { echo "::error::$1"; }
          emit "HEAD=$(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          grep -n 'GOOGLE_OAUTH' app/build.gradle.kts | while IFS= read -r l; do emit "GRADLE| $l"; done
          BC="app/build/generated/source/buildConfig/legacy/debug/app/gamenative/BuildConfig.java"
          if [ -f "$BC" ]; then
            sed -n '13,22p' "$BC" | while IFS= read -r l; do emit "BC| $l"; done
          else
            emit "BC| (not generated)"
          fi
          if [ -f gradle-build.log ]; then
            awk '/^e: /{n++} n>0 && n<=6 {print}' gradle-build.log | head -n 40 | while IFS= read -r line; do
              emit "$(printf '%s' "$line" | tr '%\r\n' '    ')"
            done
            tail -n 30 gradle-build.log
          fi

      - name: List APKs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-${{ inputs.variant }}-debug
          path: app/build/outputs/apk/**/app-*-debug.apk
          if-no-files-found: error
