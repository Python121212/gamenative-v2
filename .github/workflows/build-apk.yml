name: Build APK (Debug)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "legacy"
        type: choice
        options:
          - legacy
          - modern
          - legacyXr
          - modernXr
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key keeps the APK SHA-1 stable across builds,
      # which an "Android" OAuth client requires.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; falling back to the generated debug key."
            exit 0
          fi
          mkdir -p ci-signing
          echo "$KEYSTORE_BASE64" | base64 -d > ci-signing/release.jks
          echo "KEYSTORE_FILE=$PWD/ci-signing/release.jks" >> "$GITHUB_ENV"

      - name: Inject credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Never write empty values: the secrets plugin turns every entry of
          # local.properties into a BuildConfig field, and an empty one is
          # invalid Java (`= ;`).
          {
            echo "POSTHOG_API_KEY=dummy"
            echo "POSTHOG_HOST=https://us.i.posthog.com"
            if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
              echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
            fi
          } > local.properties
          sed 's/=.*/=<set>/' local.properties
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-36" "ndk;27.3.13750724"

      - name: Build debug APK
        run: |
          set -o pipefail
          case "${{ inputs.variant }}" in
            legacy) ./gradlew :app:assembleLegacyDebug ;;
            modern) ./gradlew :app:assembleModernDebug ;;
            legacyXr) ./gradlew :app:assembleLegacyXrDebug ;;
            modernXr) ./gradlew :app:assembleModernXrDebug ;;
            all) ./gradlew :app:assembleLegacyDebug :app:assembleModernDebug ;;
          esac 2>&1 | tee gradle-build.log

      # The unit-test sources are not part of assembleDebug: compile them, and run the
      # translation-stack and AI-diagnosis suites so a regression in layer de-duplication
      # or in the diagnosis rules fails here (both run offline, no network).
      - name: Unit tests (translation stack + AI diagnosis)
        if: inputs.variant == 'legacy'
        run: |
          set -o pipefail
          ./gradlew :app:compileLegacyDebugUnitTestKotlin :app:testLegacyDebugUnitTest \
            --tests "app.gamenative.translation.*" --tests "app.gamenative.aidiag.*" 2>&1 | tee gradle-tests.log

      # Surface Kotlin/Gradle errors as check annotations so they can be read
      # through the API even when the raw log download is unavailable.
      # GitHub allows ~10 error annotations per step, so keep this list short and specific.
      - name: Report build errors
        if: failure()
        run: |
          emit() { printf '::error::%s\n' "$(printf '%s' "$1" | tr '%\r\n' '    ')"; }
          emit "HEAD=$(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          # Kotlin (`e: file://…`), javac, JUnit and Gradle failure lines, in that order.
          # GitHub allows ~10 annotations per step, so stop at nine.
          {
            for LOG in gradle-tests.log gradle-build.log; do
              [ -f "$LOG" ] || continue
              grep -nE '^e: |error:| FAILED|ComparisonFailure|AssertionError|expected:<|What went wrong|Execution failed for task|Caused by:' "$LOG" \
                | sed "s|^|$LOG:|" | cut -c1-350
            done
          } | head -n 9 | while IFS= read -r line; do emit "$line"; done
          for LOG in gradle-tests.log gradle-build.log; do
            [ -f "$LOG" ] && echo "$LOG: $(wc -l < "$LOG") lines"
          done

      - name: List APKs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # Needed to register an "Android" OAuth client for the Drive pseudo-SSD.
      - name: Print signing certificate SHA-1
        if: success()
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            SHA1=$(keytool -printcert -jarfile "$APK" | grep -Ei "SHA1:" | head -1 | sed 's/.*SHA1: //')
            echo "APK SHA-1: $SHA1"
            echo "::notice title=APK SHA-1::$SHA1"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-${{ inputs.variant }}-debug
          path: app/build/outputs/apk/**/app-*-debug.apk
          if-no-files-found: error
