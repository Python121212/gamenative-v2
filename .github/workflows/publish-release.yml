name: Publish APK to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run ID that produced the APK artifact"
        required: true
        default: "43131067116"
      artifact_name:
        description: "Artifact name containing the APK"
        required: true
        default: "gamenative-legacy-debug"
      tag:
        description: "Release tag"
        required: true
        default: "v1.4.0-debug"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: ./apk

      - name: List APK
        run: find ./apk -name "*.apk" -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
